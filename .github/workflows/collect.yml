# Every hour: collect jobs, send alerts, post to groups, the 9 o'clock message,
# then deploy the bot + site to Vercel with the fresh read-only snapshot.
name: collect

on:
  schedule:
    - cron: "7 * * * *"          # minute 7 of every hour (GitHub may start it a few minutes late)
  workflow_dispatch:
    inputs:
      full:
        description: "Full run (all sources)"
        type: boolean
        default: false

concurrency:
  group: collect                 # never two runs at once (they share the stored files)
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
      CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      LINKEDIN_ENABLED: ${{ vars.LINKEDIN_ENABLED }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-collect.txt

      - name: Install packages
        run: pip install -r requirements-collect.txt

      - name: Restore stored jobs (kept between runs)
        uses: actions/cache/restore@v4
        with:
          path: data/store
          key: store-${{ github.run_id }}
          restore-keys: store-

      - name: Decide full or fast run
        id: mode
        run: |
          hour=$(TZ=Asia/Riyadh date +%H)
          if [ "${{ inputs.full }}" = "true" ] || [ $((10#$hour % 3)) -eq 0 ]; then echo "full=1" >> "$GITHUB_OUTPUT"; else echo "full=0" >> "$GITHUB_OUTPUT"; fi

      - name: Browser for JavaScript pages (full runs)
        if: steps.mode.outputs.full == '1'
        run: python -m playwright install --with-deps chromium

      - name: Collect, alert, post
        run: python tools/cloud_run.py ${{ steps.mode.outputs.full == '1' && '--full' || '' }}

      - name: Save stored jobs
        if: always() && hashFiles('data/store/jobs.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/store
          key: store-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy bot + site to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@53 deploy --prod --yes --token "$VERCEL_TOKEN" > /dev/null
