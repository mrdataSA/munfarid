# Manual check: how does a site answer GitHub's servers? (status, server, first bytes)
name: probe

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs separated by spaces"
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        env:
          URLS: ${{ inputs.urls }}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36 RizqJobsBot/1.0"
          n=0
          for u in $URLS; do
            echo "=================== $u"
            n=$((n+1)); curl -sS -m 25 -A "$UA" -o body.txt -D headers.txt -w "status=%{http_code} ip=%{remote_ip} time=%{time_total}s size=%{size_download}\n" "$u" || echo "curl failed: $?"
            grep -iE "^(server|cf-ray|x-cache|location|content-type|via|x-amz|akamai|x-iinfo|set-cookie: (incap|visid|__cf))" headers.txt | cut -c1-160 || true
            head -c 600 body.txt | tr -d '\r'; echo
            mkdir -p bodies; cp body.txt "bodies/$n.txt" 2>/dev/null || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bodies
          path: bodies/
          retention-days: 1
